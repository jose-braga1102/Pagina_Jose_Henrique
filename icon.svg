<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente para o sorriso acompanhando a divisão de cores -->
    <linearGradient id="split-color" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="50%" stop-color="#A5765A" />
      <stop offset="50%" stop-color="#7B5037" />
    </linearGradient>
    
    <!-- Máscara para criar o vazado transparente em volta do sorriso -->
    <mask id="cutout">
      <rect width="100" height="100" fill="white" />
      <path d="M 18,52 Q 50,85 82,52" fill="none" stroke="black" stroke-width="9" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Hexágono Base com a máscara (corte) aplicada -->
  <g mask="url(#cutout)">
    <!-- Lado Esquerdo Claro -->
    <polygon points="50,8 30,30 30,75 50,95" fill="#A5765A" />
    <!-- Lado Direito Escuro -->
    <polygon points="50,8 70,30 70,75 50,95" fill="#7B5037" />
  </g>

  <!-- Sorriso (Curva sobreposta) -->
  <path d="M 18,52 Q 50,85 82,52" fill="none" stroke="url(#split-color)" stroke-width="3.5" stroke-linecap="round" />
</svg>